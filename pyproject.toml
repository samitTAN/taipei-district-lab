[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "taipei-district-lab-api"
version = "0.3.0"
description = "FastAPI backend for Taipei District Lab"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.7,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

geo = ["pyshp>=3.0,<4", "pyproj>=3.6,<4", "shapely>=2,<3"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests/backend"]
